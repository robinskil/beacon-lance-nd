[package]
name = "lance-nd-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "lance_nd_native"
crate-type = ["cdylib"]

[dependencies]
# Pin a Beacon release tag here. The tag fixes the DataFusion version.
beacon-plugin-sdk = { git = "https://github.com/maris-development/beacon", branch = "main" }
# The Lance pin must match the Lance pin of Beacon.
lance = { version = "=11.0.0", default-features = false }
lance-nd = { git = "https://github.com/robinskil/lance-nd", rev = "16da270354f08a98776c78e3393d7671d8bd045e" }
# Same source as lance-nd, so both use one crate. Cargo.lock pins the commit.
nd-arrow-array = { git = "https://github.com/robinskil/nd-arrow-array" }
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
