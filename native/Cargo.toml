[package]
name = "lance-nd-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "lance_nd_native"
crate-type = ["cdylib"]

[dependencies]
# The Beacon tag fixes the SDK ABI and the DataFusion version.
beacon-plugin-sdk = { git = "https://github.com/maris-development/beacon", tag = "v2.1.0-rc2" }
# The Lance pin must match the Lance pin of Beacon.
lance = { version = "=11.0.0", default-features = false, features = ["aws", "azure", "gcp"] }
lance-nd = { git = "https://github.com/robinskil/lance-nd", rev = "b98f65a0976b07be21374f891ccbfa17e943c668" }
# Same source as lance-nd, so both use one crate. Cargo.lock pins the commit.
nd-arrow-array = { git = "https://github.com/robinskil/nd-arrow-array" }
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
